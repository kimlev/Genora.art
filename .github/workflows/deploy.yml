name: Deploy Genora

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload dev release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".,!node_modules,!.git,!.next,!.gitnexus,!prototype/node_modules,!prototype/.next"
          target: /srv/apps/genora-art-dev
          overwrite: true
      - name: Deploy isolated dev environment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/apps/genora-art-dev
            test -f infra/genora-dev/.env
            bash infra/staging/apply-dev-nginx.sh /srv/apps/genora-art-dev
            cd infra/genora-dev
            docker compose up -d --build postgres app support-worker
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' genora-dev-app 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              if [ "$attempt" -eq 40 ]; then
                docker compose ps
                docker compose logs --tail=120 app
                exit 1
              fi
              sleep 5
            done
            docker compose ps

  deploy-prod:
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload production release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".,!node_modules,!.git,!.next,!.gitnexus,!prototype/node_modules,!prototype/.next"
          target: /srv/apps/genora-art
          overwrite: true
      - name: Deploy isolated production environment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/apps/genora-art
            bash infra/production/prepare-env.sh
            cp infra/production/nginx-modelstation.conf /etc/nginx/sites-available/genora.art.conf
            ln -sfn /etc/nginx/sites-available/genora.art.conf /etc/nginx/sites-enabled/genora.art.conf
            nginx -t
            systemctl reload nginx
            cd infra/production
            docker compose up -d --build postgres app support-worker
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' genora-prod-app 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              if [ "$attempt" -eq 40 ]; then
                docker compose ps
                docker compose logs --tail=120 app
                exit 1
              fi
              sleep 5
            done
            docker compose ps
