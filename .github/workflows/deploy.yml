name: Deploy Genora

permissions:
  contents: read

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy isolated dev environment
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,RELEASE_SHA
          script_stop: true
          script: |
            set -euo pipefail
            release_dir="$(mktemp -d /tmp/genora-dev-release.XXXXXX)"
            trap 'rm -rf "$release_dir"' EXIT
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/tarball/$RELEASE_SHA" \
              | tar -xz -C "$release_dir" --strip-components=1
            mkdir -p /srv/apps/genora-art-dev
            rsync -a \
              --exclude '.env' --exclude '.env.*' --exclude '*.env' \
              --exclude 'node_modules' --exclude '.next' --exclude '.gitnexus' \
              "$release_dir/" /srv/apps/genora-art-dev/
            cd /srv/apps/genora-art-dev
            test -f infra/genora-dev/.env
            bash infra/staging/apply-dev-nginx.sh /srv/apps/genora-art-dev
            cd infra/genora-dev
            docker compose up -d --build postgres app support-worker
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' genora-dev-app 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              if [ "$attempt" -eq 40 ]; then
                docker compose ps
                docker compose logs --tail=120 app
                exit 1
              fi
              sleep 5
            done
            docker compose ps

  deploy-prod:
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy isolated production environment
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,RELEASE_SHA
          script_stop: true
          script: |
            set -euo pipefail
            release_dir="$(mktemp -d /tmp/genora-prod-release.XXXXXX)"
            trap 'rm -rf "$release_dir"' EXIT
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/tarball/$RELEASE_SHA" \
              | tar -xz -C "$release_dir" --strip-components=1
            mkdir -p /srv/apps/genora-art
            rsync -a \
              --exclude '.env' --exclude '.env.*' --exclude '*.env' \
              --exclude 'node_modules' --exclude '.next' --exclude '.gitnexus' \
              "$release_dir/" /srv/apps/genora-art/
            cd /srv/apps/genora-art
            bash infra/production/prepare-env.sh
            cp infra/production/nginx-prod-hosts.conf /etc/nginx/sites-available/genora.art.conf
            ln -sfn /etc/nginx/sites-available/genora.art.conf /etc/nginx/sites-enabled/genora.art.conf
            nginx -t
            systemctl reload nginx
            cd infra/production
            docker compose up -d --build postgres app support-worker
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' genora-prod-app 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              if [ "$attempt" -eq 40 ]; then
                docker compose ps
                docker compose logs --tail=120 app
                exit 1
              fi
              sleep 5
            done
            docker compose ps
