name: Deploy Genora dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Genora project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".,!node_modules,!.git,!.next,!web/node_modules,!prototype/node_modules,!prototype/.next"
          target: /srv/apps/genora-art-dev
          overwrite: true
      - name: Rebuild isolated Genora dev
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/apps/genora-art-dev/infra/genora-dev
            docker compose up -d postgres
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' genora-dev-postgres 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              [ "$attempt" -eq 30 ] && { docker compose logs --tail=80 postgres; exit 1; }
              sleep 2
            done
            docker compose up -d --build app support-worker
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' genora-dev-app 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              [ "$attempt" -eq 40 ] && { docker compose ps app support-worker; docker compose logs --tail=120 app; exit 1; }
              sleep 5
            done
            docker compose ps app support-worker
