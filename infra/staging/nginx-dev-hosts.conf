# Копия Genora.art: отдельные хосты, отдельный контейнер на 13311.
# Весь контур закрыт от индексации.

server {
    listen 80;
    listen [::]:80;
    server_name dev.genora.art dev.admin.genora.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/genora;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.genora.art;

    ssl_certificate /etc/letsencrypt/live/genora-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genora-dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 150m;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /admin { return 404; }
    location ^~ /api/admin/ { return 404; }

    location = /blogoro/publish {
        client_max_body_size 90m;
        limit_req zone=genora_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:13311;
        proxy_read_timeout 60s;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=genora_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:13311;
        proxy_http_version 1.1;
        proxy_read_timeout 3720s;
        proxy_send_timeout 3720s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_genora;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.admin.genora.art;

    ssl_certificate /etc/letsencrypt/live/genora-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genora-dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:13311;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location / {
        client_max_body_size 25m;
        limit_req zone=genora_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:13311;
        proxy_http_version 1.1;
        proxy_read_timeout 3720s;
        proxy_send_timeout 3720s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
