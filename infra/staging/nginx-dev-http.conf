# HTTP для копии: редирект на https и проверка Let's Encrypt.
# Ставится сразу. HTTPS-блоки — только после выпуска сертификата.

server {
    listen 80;
    listen [::]:80;
    server_name dev.genora.art dev.admin.genora.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/genora;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
